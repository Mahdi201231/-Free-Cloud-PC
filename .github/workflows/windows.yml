name: Windows Cloud Test

on:
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - name: Hardware Information
        shell: pwsh
        run: |
          Write-Host "===== WINDOWS ====="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version

          Write-Host "===== CPU ====="
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores

          Write-Host "===== RAM ====="
          Get-CimInstance Win32_ComputerSystem | ForEach-Object {
            "RAM: {0:N2} GB" -f ($_.TotalPhysicalMemory / 1GB)
          }

          Write-Host "===== DISK ====="
          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" | ForEach-Object {
            "Total: {0:N2} GB" -f ($_.Size / 1GB)
            "Free: {0:N2} GB" -f ($_.FreeSpace / 1GB)
          }
          
          Write-Host "===== GPU ====="
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, DriverVersion
          Write-Host "===== DISPLAY DEVICES ====="
          Get-PnpDevice -Class Display | Format-List FriendlyName, Status
